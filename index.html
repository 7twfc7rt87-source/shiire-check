<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>仕入チェック Ver.1</title>
  <style>
    :root{
      --bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;
      --good:#047857;--warn:#b45309;--bad:#b91c1c;--primary:#111827;--blue:#1d4ed8;
    }
    *{box-sizing:border-box}
    body{
      margin:0;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
    }
    main{max-width:680px;margin:auto;padding:18px 14px 40px}
    h1{font-size:25px;margin:4px 0 3px}
    .sub,.note{color:var(--muted);font-size:12px;line-height:1.6}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
    label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}
    input{
      width:100%;font-size:18px;padding:13px;border-radius:12px;border:1px solid #d1d5db;background:#fff;
    }
    .grid,.buttons,.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .buttons{margin-top:12px}
    button,a.button{
      display:block;width:100%;padding:13px 10px;border-radius:12px;border:0;
      font-size:15px;font-weight:700;text-decoration:none;text-align:center;cursor:pointer;
    }
    .primary{background:var(--primary);color:#fff}
    .lookup{background:var(--blue);color:#fff}
    .secondary{background:#e5e7eb;color:#111827}
    .search{background:#fff;color:#111827;border:1px solid var(--line)!important}
    .result{text-align:center;background:#f9fafb;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
    .judge{font-size:27px;font-weight:800}
    .good{color:var(--good)} .warn{color:var(--warn)} .bad{color:var(--bad)}
    .metric{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}
    .metric .k{font-size:12px;color:var(--muted);margin-bottom:5px}
    .metric .v{font-size:21px;font-weight:800}
    .wide{grid-column:1/-1}
    .pill{font-size:11px;padding:3px 8px;border-radius:999px;background:#e5e7eb;color:#374151}
    .product{display:none;gap:14px;align-items:flex-start;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
    .product.show{display:flex}
    .product img{width:105px;height:105px;object-fit:contain;border:1px solid var(--line);border-radius:12px;background:#fff;flex:0 0 auto}
    .product-info{min-width:0}
    .product-name{font-size:15px;font-weight:800;line-height:1.45;margin-bottom:6px}
    .product-meta{font-size:12px;color:var(--muted);line-height:1.65}
    .status{font-size:13px;margin-top:10px;min-height:20px}
    .status.loading{color:var(--blue)} .status.error{color:var(--bad)} .status.ok{color:var(--good)}
    @media(max-width:440px){
      .grid,.buttons,.metrics{grid-template-columns:1fr}
      .wide{grid-column:auto}
      .product img{width:90px;height:90px}
    }
  </style>
</head>
<body>
<main>
  <h1>仕入チェック <span class="pill">Ver.1</span></h1>
  <div class="sub">JANから商品情報を自動取得</div>

  <section class="card">
    <label>JANコード</label>
    <input id="jan" inputmode="numeric" autocomplete="off" placeholder="例：4901001212767" maxlength="13">

    <div class="buttons">
      <button id="lookupBtn" class="lookup" type="button">JANから商品を取得</button>
      <button id="clearProductBtn" class="secondary" type="button">商品情報をクリア</button>
    </div>

    <div id="lookupStatus" class="status"></div>

    <div id="productBox" class="product">
      <img id="productImage" alt="商品画像">
      <div class="product-info">
        <div id="productNameDisplay" class="product-name"></div>
        <div class="product-meta">
          <div id="productBrandDisplay"></div>
          <div id="productYahooPrice"></div>
          <div id="productHitCount"></div>
        </div>
      </div>
    </div>

    <label>検索に使う商品名・型番</label>
    <input id="name" autocomplete="off" placeholder="JAN取得後に自動入力／手入力も可">

    <div class="buttons">
      <a id="mercari" class="button search" href="#">メルカリで検索</a>
      <a id="yahooClosed" class="button search" href="#">ヤフオク落札相場</a>
    </div>
    <div class="buttons">
      <a id="yahooCurrent" class="button search" href="#">ヤフオク開催中</a>
      <button id="copyBtn" class="search" type="button">検索語をコピー</button>
    </div>
    <div class="note">
      商品取得後は商品名を検索語へ自動セットします。検索結果が広すぎる場合は、型番だけ残すなど手動修正できます。
    </div>
  </section>

  <section class="card">
    <div class="grid">
      <div>
        <label>仕入価格</label>
        <input id="buy" type="number" inputmode="decimal" min="0" placeholder="3980">
      </div>
      <div>
        <label>想定売価</label>
        <input id="sell" type="number" inputmode="decimal" min="0" placeholder="7500">
      </div>
      <div>
        <label>送料</label>
        <input id="shipping" type="number" inputmode="decimal" min="0" value="750">
      </div>
      <div>
        <label>販売手数料（%）</label>
        <input id="fee" type="number" inputmode="decimal" min="0" max="100" step="0.1" value="10">
      </div>
      <div class="wide">
        <label>目標利益</label>
        <input id="target" type="number" inputmode="decimal" min="0" value="2000">
      </div>
    </div>

    <div class="buttons">
      <button id="calcBtn" class="primary" type="button">仕入判定する</button>
      <button id="resetBtn" class="secondary" type="button">金額をリセット</button>
    </div>
  </section>

  <section class="card">
    <div class="result">
      <div id="judge" class="judge">入力待ち</div>
      <div id="judgeSub" class="sub">仕入価格と想定売価を入力してください</div>
    </div>
    <div class="metrics">
      <div class="metric"><div class="k">想定利益</div><div id="profit" class="v">—</div></div>
      <div class="metric"><div class="k">利益率（売価比）</div><div id="margin" class="v">—</div></div>
      <div class="metric"><div class="k">販売手数料</div><div id="feeAmount" class="v">—</div></div>
      <div class="metric"><div class="k">最大仕入価格</div><div id="maxBuy" class="v">—</div></div>
      <div class="metric wide"><div class="k">最大仕入価格との差</div><div id="room" class="v">—</div></div>
    </div>
    <div class="note" style="margin-top:10px">
      判定基準：想定利益が目標利益以上＝仕入候補、黒字だが目標未達＝要検討、赤字＝見送り。
    </div>
  </section>
</main>

<script>
(() => {
  const WORKER_URL = "https://shiire-check-api.7twfc7rt87.workers.dev/";
  const $ = id => document.getElementById(id);
  const savedIds = ["jan","name","shipping","fee","target"];

  const term = () => $("name").value.trim() || $("jan").value.trim();

  const updateLinks = () => {
    const raw = term();
    const q = encodeURIComponent(raw);
    $("mercari").href = raw ? "https://jp.mercari.com/search?keyword=" + q : "#";
    $("yahooClosed").href = raw ? "https://auctions.yahoo.co.jp/closedsearch/closedsearch?p=" + q : "#";
    $("yahooCurrent").href = raw ? "https://auctions.yahoo.co.jp/search/search?p=" + q : "#";
  };

  const guard = e => {
    if (!term()) {
      e.preventDefault();
      alert("JANコードか商品名を入力してください");
    }
  };

  ["mercari","yahooClosed","yahooCurrent"].forEach(id => $(id).addEventListener("click", guard));

  savedIds.forEach(id => {
    const v = localStorage.getItem("shiire_" + id);
    if (v !== null) $(id).value = v;
    $(id).addEventListener("input", () => {
      localStorage.setItem("shiire_" + id, $(id).value);
      if (id === "jan" || id === "name") updateLinks();
    });
  });

  const setLookupStatus = (msg, type="") => {
    $("lookupStatus").textContent = msg;
    $("lookupStatus").className = "status" + (type ? " " + type : "");
  };

  const clearProduct = () => {
    $("productBox").classList.remove("show");
    $("productImage").removeAttribute("src");
    $("productNameDisplay").textContent = "";
    $("productBrandDisplay").textContent = "";
    $("productYahooPrice").textContent = "";
    $("productHitCount").textContent = "";
    setLookupStatus("");
  };

  const lookupProduct = async () => {
    const jan = $("jan").value.trim();

    if (!/^\d{8}$|^\d{13}$/.test(jan)) {
      setLookupStatus("JANコードは8桁または13桁の数字で入力してください", "error");
      return;
    }

    $("lookupBtn").disabled = true;
    $("lookupBtn").textContent = "取得中…";
    setLookupStatus("Yahoo!の商品情報を検索しています…", "loading");

    try {
      const res = await fetch(WORKER_URL + "?jan=" + encodeURIComponent(jan), {
        method: "GET",
        cache: "no-store"
      });

      let data;
      try {
        data = await res.json();
      } catch {
        throw new Error("APIから正しいデータが返りませんでした");
      }

      if (!res.ok) {
        throw new Error(data.error || "商品検索に失敗しました");
      }

      if (!data.found) {
        clearProduct();
        setLookupStatus("このJANの商品が見つかりませんでした。商品名を手入力してください。", "error");
        return;
      }

      const productName = (data.name || "").trim();
      const brand = (data.brand || "").trim();

      $("productNameDisplay").textContent = productName || "商品名なし";
      $("productBrandDisplay").textContent = brand ? "ブランド：" + brand : "";
      $("productYahooPrice").textContent =
        data.yahooPrice !== null && data.yahooPrice !== undefined
          ? "Yahoo!参考価格：" + Number(data.yahooPrice).toLocaleString("ja-JP") + "円"
          : "";
      $("productHitCount").textContent =
        data.hitCount !== null && data.hitCount !== undefined
          ? "JAN一致候補：" + data.hitCount + "件"
          : "";

      if (data.image) {
        $("productImage").src = data.image;
        $("productImage").style.display = "block";
      } else {
        $("productImage").style.display = "none";
      }

      $("productBox").classList.add("show");

      if (productName) {
        $("name").value = productName;
        localStorage.setItem("shiire_name", productName);
      }

      updateLinks();
      setLookupStatus("商品情報を取得しました。下の検索ボタンで相場を確認できます。", "ok");
    } catch (err) {
      clearProduct();
      setLookupStatus("取得エラー：" + (err.message || "通信に失敗しました"), "error");
    } finally {
      $("lookupBtn").disabled = false;
      $("lookupBtn").textContent = "JANから商品を取得";
    }
  };

  $("lookupBtn").addEventListener("click", lookupProduct);
  $("clearProductBtn").addEventListener("click", () => {
    clearProduct();
    $("name").value = "";
    localStorage.removeItem("shiire_name");
    updateLinks();
  });

  $("jan").addEventListener("keydown", e => {
    if (e.key === "Enter") {
      e.preventDefault();
      lookupProduct();
    }
  });

  const num = id => {
    const v = parseFloat($(id).value);
    return Number.isFinite(v) ? v : 0;
  };
  const yen = x => Number.isFinite(x) ? Math.round(x).toLocaleString("ja-JP") + "円" : "—";

  const empty = () => {
    $("judge").textContent = "入力待ち";
    $("judge").className = "judge";
    $("judgeSub").textContent = "仕入価格と想定売価を入力してください";
    ["profit","margin","feeAmount","maxBuy","room"].forEach(id => $(id).textContent = "—");
  };

  const calculate = () => {
    const buy = num("buy"), sell = num("sell"), shipping = num("shipping"), feePct = num("fee"), target = num("target");
    if (sell <= 0) return empty();

    const feeAmount = sell * feePct / 100;
    const profit = sell - feeAmount - shipping - buy;
    const margin = profit / sell * 100;
    const maxBuy = sell - feeAmount - shipping - target;
    const room = maxBuy - buy;

    $("profit").textContent = yen(profit);
    $("margin").textContent = margin.toFixed(1) + "%";
    $("feeAmount").textContent = yen(feeAmount);
    $("maxBuy").textContent = yen(maxBuy);
    $("room").textContent = (room >= 0 ? "+" : "") + yen(room);

    $("judge").className = "judge";
    if (profit >= target) {
      $("judge").textContent = "🟢 仕入候補";
      $("judge").classList.add("good");
      $("judgeSub").textContent = "目標利益をクリア";
    } else if (profit >= 0) {
      $("judge").textContent = "🟠 要検討";
      $("judge").classList.add("warn");
      $("judgeSub").textContent = "黒字ですが目標利益には未達";
    } else {
      $("judge").textContent = "🔴 見送り";
      $("judge").classList.add("bad");
      $("judgeSub").textContent = "想定条件では赤字";
    }
  };

  $("calcBtn").addEventListener("click", calculate);
  $("resetBtn").addEventListener("click", () => {
    $("buy").value = "";
    $("sell").value = "";
    empty();
  });
  ["buy","sell","shipping","fee","target"].forEach(id => $(id).addEventListener("input", calculate));

  $("copyBtn").addEventListener("click", async () => {
    const q = term();
    if (!q) return alert("JANコードか商品名を入力してください");
    try {
      await navigator.clipboard.writeText(q);
      alert("検索語をコピーしました");
    } catch {
      prompt("この検索語をコピーしてください", q);
    }
  });

  updateLinks();
})();
</script>
</body>
</html>
